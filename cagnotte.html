<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Soutien au Big I</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f8f9fa;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        h1 {
            color: #007bff;
        }
        .amount {
            font-size: 24px;
            font-weight: bold;
            margin: 20px 0;
        }
        .button {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .button:hover {
            background-color: #218838;
        }
        .message {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Big Soutien au Big I</h1>
        <p class="amount">Montant collecté : 1,12€</p>
        <button class="button">Participer</button>
        <p class="message">Imene rencontre des problèmes liées à son droit d'image, en raison d'une petite querelle entre ami dont elle n'est même pas concernée, SAUVER IMENE, CHAQUE EURO COMPTE</p>
    </div>
</body>
</html>
